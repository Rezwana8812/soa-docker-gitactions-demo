
services:

  postgres:
    image: postgres:16-alpine
    container_name: tourist-postgres
    environment:
      POSTGRES_DB: touristdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tourist-data:/var/lib/postgresql/data

  backend:
    image: docker-skill-exam-2400033116:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tourist-backend
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/touristdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - postgres

volumes:
  tourist-data:
